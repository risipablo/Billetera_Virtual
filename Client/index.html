    <link rel="icon" type="image/png" sizes="16x16" href="/logo.png">

    <link rel="icon" type="image/png" sizes="512x512" href="/logo.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/logo.png">

    <!-- Meta básicos -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1e3a8a" />
    <meta name="author" content="Guita" />

    <!-- SEO -->
    <title>Guita - Tu billetera virtual personal | Controlá tus gastos</title>
    <meta
      name="description"
      content="Guita es tu billetera virtual para controlar gastos, cuotas, metas de ahorro e inversiones. Sabé en qué se va tu plata y tomá mejores decisiones financieras."
    />
    <meta
      name="keywords"
      content="guita, billetera virtual, control de gastos, finanzas personales, ahorro, cuotas, inversiones, app de gastos"
    />
    <link rel="canonical" href="https://billetera-virtual-teal.vercel.app/" />

    <!-- Open Graph (Facebook, WhatsApp, LinkedIn) -->
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="es_AR" />
    <meta property="og:site_name" content="Guita" />
    <meta property="og:url" content="https://billetera-virtual-teal.vercel.app/" />
    <meta property="og:title" content="Guita - Tu billetera virtual personal" />
    <meta
      property="og:description"
      content="Controlá tus gastos, seguí tus cuotas y alcanzá tus metas de ahorro. Todo en un solo lugar."
    />
    <meta property="og:image" content="https://billetera-virtual-teal.vercel.app/logo.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Guita - Tu billetera virtual" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Guita - Tu billetera virtual personal" />
    <meta
      name="twitter:description"
      content="Controlá tus gastos, seguí tus cuotas y alcanzá tus metas de ahorro."
    />
    <meta name="twitter:image" content="https://billetera-virtual-teal.vercel.app/logo.png" />

    <!-- Preconnect para fonts (si usás Google Fonts) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Splash inicial inline (para que aparezca antes de que cargue React) -->
    <style>
      html, body {
        margin: 0;
        padding: 0;
        background: #ffffff;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      }

      #initial-splash {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1.5rem;
        background: #ffffff;
        z-index: 9999;
      }

      #initial-splash img {
        width: 180px;
        max-width: 60vw;
        height: auto;
        object-fit: contain;
        filter: drop-shadow(0 8px 24px rgba(30, 58, 138, 0.18));
        animation: splash-fade-in 0.5s ease-out;
      }

      #initial-splash .initial-frase {
        font-size: 1rem;
        font-weight: 500;
        color: #4B4B55;
        letter-spacing: 0.02em;
        margin: 0;
        animation: splash-fade-in 0.8s ease-out;
      }

      #initial-splash .initial-dots {
        display: flex;
        gap: 6px;
        margin-top: 0.5rem;
      }

      #initial-splash .initial-dots span {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: #1e3a8a;
        animation: initial-bounce 1.2s infinite ease-in-out;
      }

      #initial-splash .initial-dots span:nth-child(2) { animation-delay: 0.15s; }
      #initial-splash .initial-dots span:nth-child(3) { animation-delay: 0.3s; }

      @keyframes splash-fade-in {
        from { opacity: 0; transform: scale(0.9); }
        to   { opacity: 1; transform: scale(1); }
      }

      @keyframes initial-bounce {
        0%, 80%, 100% { transform: scale(0.7); opacity: 0.5; }
        40%          { transform: scale(1);   opacity: 1; }
      }

      #initial-splash.hidden {
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.3s ease;
      }
    </style>
  </head>
  <body>
    <!-- Splash inicial FUERA del root (React no lo va a pisar) -->
    <div id="initial-splash">
      <img src="/logo.png" alt="Guita" />
      <p class="initial-frase">Cargando...</p>
      <div class="initial-dots">
        <span></span>
        <span></span>
        <span></span>
      </div>
    </div>

    <!-- Root de React -->
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
