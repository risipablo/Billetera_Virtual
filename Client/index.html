<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />

    <!-- Favicon -->
    <link rel="icon" type="image/png" sizes="32x32" href="./public/logo.png">
    <link rel="icon" type="image/png" sizes="16x16" href="./public/logo.png">
    <link rel="icon" type="image/png" sizes="192x192" href="./public/logo.png">
    <link rel="icon" type="image/png" sizes="512x512" href="./public/logo.png">
    <link rel="apple-touch-icon" sizes="180x180" href="./public/logo.png">

    <!-- Meta -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#7C3AED" />
    <meta name="description" content="Guita - Tu billetera virtual personal. Controlá tus gastos, cuotas e inversiones en un solo lugar." />
    <title>Guita - Tu billetera virtual personal</title>

    
    <style>
      html, body {
        margin: 0;
        padding: 0;
        background: #ffffff;
      }

      #initial-splash {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1.5rem;
        background: #ffffff;
        z-index: 9999;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      }

      #initial-splash img {
        width: 180px;
        max-width: 60vw;
        height: auto;
        object-fit: contain;
        filter: drop-shadow(0 8px 24px rgba(124, 58, 237, 0.18));
        animation: splash-fade-in 0.5s ease-out;
      }

      #initial-splash .initial-frase {
        font-size: 1rem;
        font-weight: 500;
        color: #4B4B55;
        letter-spacing: 0.02em;
        margin: 0;
        animation: splash-fade-in 0.8s ease-out;
      }

      #initial-splash .initial-dots {
        display: flex;
        gap: 6px;
        margin-top: 0.5rem;
      }

      #initial-splash .initial-dots span {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: #d0de33;
        animation: initial-bounce 1.2s infinite ease-in-out;
      }

      #initial-splash .initial-dots span:nth-child(2) { animation-delay: 0.15s; }
      #initial-splash .initial-dots span:nth-child(3) { animation-delay: 0.3s; }

      @keyframes splash-fade-in {
        from { opacity: 0; transform: scale(0.9); }
        to   { opacity: 1; transform: scale(1); }
      }

      @keyframes initial-bounce {
        0%, 80%, 100% { transform: scale(0.7); opacity: 0.5; }
        40%          { transform: scale(1);   opacity: 1; }
      }

      
      #initial-splash.hidden {
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.3s ease;
      }
    </style>
  </head>
  <body>
    <div id="root">
      
      <div id="initial-splash">
        <img src="./public/logo.png" alt="Guita" />
        <p class="initial-frase">Cargando...</p>
        <div class="initial-dots">
          <span></span>
          <span></span>
          <span></span>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
